name: Redeploy (no scrape)

on:
  workflow_dispatch:
  # Auto-redeploy on static-asset-only changes (css/js/manifest/icons) — this
  # job never re-renders index.html, so it can't pick up template/Python
  # changes; those need a real scrape (workflow_dispatch on scrape.yml).
  push:
    branches: [main]
    paths:
      - 'static/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Restore cached data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: never-match
          restore-keys: oikotie-cache-

      - name: Copy static PWA assets
        run: cp -r static/. data/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          include_nojekyll: true
